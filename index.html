<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klakz Hub | Script Center</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #00f2fe;
            margin-bottom: 25px;
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
        }
        .container {
            width: 100%;
            max-width: 650px;
        }
        .script-card {
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #00f2fe;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .script-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .script-desc {
            font-size: 0.9rem;
            color: #a0a0b0;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .btn-copy {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-copy:hover {
            background: #4facfe;
            transform: translateY(-1px);
        }
        .btn-copy.copied {
            background: #00e676 !important;
            color: #000;
        }
    </style>
</head>
<body>

    <h1>Klakz Script Hub</h1>

    <div class="container" id="script-list">
        <div class="script-card">
            <div class="script-title">Yükleniyor...</div>
            <div class="script-desc">Veritabanından scriptler getiriliyor.</div>
        </div>
    </div>

    <!-- Firebase App & Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDpuJm6D9752OUXZ12L__agm3UmOI1I7Dw",
        authDomain: "klakznew.firebaseapp.com",
        projectId: "klakznew",
        storageBucket: "klakznew.firebasestorage.app",
        messagingSenderId: "238260974670",
        appId: "1:238260974670:web:2e79129396a2b0967aff1f",
        measurementId: "G-0BSKME20V1"
      };

      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      // Script Kopyalama İşlevi
      function copyScript(code, button) {
          navigator.clipboard.writeText(code).then(() => {
              const originalText = button.innerText;
              button.innerText = "Kopyalandı! ✓";
              button.classList.add("copied");
              setTimeout(() => {
                  button.innerText = originalText;
                  button.classList.remove("copied");
              }, 2000);
          }).catch(err => {
              alert("Kopyalama başarısız oldu: " + err);
          });
      }

      // Firebase Realtime Database'den Canlı Veri Çekme
      const scriptListDiv = document.getElementById("script-list");
      
      database.ref("scripts").on("value", (snapshot) => {
          scriptListDiv.innerHTML = "";
          const data = snapshot.val();

          if (!data) {
              scriptListDiv.innerHTML = `
                  <div class="script-card">
                      <div class="script-title">Henüz Script Eklenmedi</div>
                      <div class="script-desc">Firebase panelinden 'scripts' yoluna veri eklediğinde burada otomatik olarak görünecek.</div>
                  </div>
              `;
              return;
          }

          Object.keys(data).forEach(key => {
              const item = data[key];
              const card = document.createElement("div");
              card.className = "script-card";
              card.innerHTML = `
                  <div class="script-title">${item.title || 'Başlıksız Script'}</div>
                  <div class="script-desc">${item.desc || 'Açıklama belirtilmedi.'}</div>
                  <button class="btn-copy" onclick="copyScript(\`${item.code}\`, this)">Scripti Kopyala</button>
              `;
              scriptListDiv.appendChild(card);
          });
      });
    </script>
</body>
</html>
