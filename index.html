<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Klakz Hub | Professional v3.0</title>
    <style>
        :root { --accent: #00ec64; --bg: #0b0c10; --card: #15171e; --text: #ffffff; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: #12141c; border-right: 1px solid #1f2330; padding: 20px; display: flex; flex-direction: column; }
        .logo { font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 30px; letter-spacing: -1px; }
        .nav-link { padding: 12px; cursor: pointer; border-radius: 8px; transition: 0.3s; margin-bottom: 5px; }
        .nav-link:hover, .nav-link.active { background: #1f2330; }
        
        /* Main */
        .container { flex: 1; overflow-y: auto; padding: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card); border: 1px solid #1f2330; border-radius: 12px; padding: 20px; transition: 0.3s; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        
        button { cursor: pointer; border: none; border-radius: 6px; padding: 10px 15px; font-weight: bold; }
        .btn-accent { background: var(--accent); color: #000; }
        input, textarea { width: 100%; background: #1a1c23; border: 1px solid #1f2330; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">KLAKZ HUB</div>
        <div id="navItems"></div>
        <div style="margin-top:auto">
            <button class="nav-link" onclick="openModal('adminModal')">⚙️ Admin Paneli</button>
        </div>
    </div>

    <div class="container">
        <h1 id="catTitle">Scriptler</h1>
        <div id="contentGrid" class="grid"></div>
    </div>

    <!-- Admin Modal -->
    <div id="adminModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); padding:50px;">
        <div style="background:var(--card); max-width:500px; margin:auto; padding:20px; border-radius:12px;">
            <h2>Script Ekle</h2>
            <input id="inTitle" placeholder="Script Adı">
            <input id="inCat" placeholder="Kategori">
            <textarea id="inCode" placeholder="Kod"></textarea>
            <button class="btn-accent" onclick="saveScript()">Kaydet</button>
            <button onclick="document.getElementById('adminModal').style.display='none'">Kapat</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('klakz_db')) || [];

        function render() {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = '';
            db.forEach((item, index) => {
                grid.innerHTML += `
                    <div class="card">
                        <h3>${item.title}</h3>
                        <p>${item.cat}</p>
                        <button class="btn-accent" onclick="copy('${item.code}')">Kopyala</button>
                        <button onclick="deleteScript(${index})">Sil</button>
                    </div>
                `;
            });
        }

        function saveScript() {
            db.push({
                title: document.getElementById('inTitle').value,
                cat: document.getElementById('inCat').value,
                code: document.getElementById('inCode').value
            });
            localStorage.setItem('klakz_db', JSON.stringify(db));
            render();
            document.getElementById('adminModal').style.display = 'none';
        }

        function deleteScript(index) {
            db.splice(index, 1);
            localStorage.setItem('klakz_db', JSON.stringify(db));
            render();
        }

        function copy(code) {
            navigator.clipboard.writeText(code);
            alert('Kod kopyalandı!');
        }

        function openModal(id) { document.getElementById(id).style.display = 'block'; }

        render();
    </script>
</body>
</html>
