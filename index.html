<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klakz Hub - Gelişmiş Yönetim Paneli</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'><rect width='100%' height='100%' rx='100' fill='%2312141c'/><path d='M160 120 v260 M200 250 L320 130 M200 250 L320 370' stroke='%2300ec64' stroke-width='45' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">

    <style>
        :root {
            --bg-body: #0b0c10; --bg-sidebar: #12141c; --bg-card: #15171e;
            --bg-input: #1a1c23; --border-color: #1f2330; --text-main: #ffffff;
            --text-muted: #a0a6b8; --accent: #00ec64; --accent-hover: #00b34a;
        }
        [data-theme="light"] {
            --bg-body: #f0f2f5; --bg-sidebar: #ffffff; --bg-card: #ffffff;
            --bg-input: #f8f9fa; --border-color: #d1d5db; --text-main: #111827;
            --text-muted: #4b5563; --accent: #059669; --accent-hover: #047857;
        }
        body { background-color: var(--bg-body); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; min-height: 100vh; }
        
        .sidebar { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; flex-shrink: 0; }
        .logo-area { font-size: 20px; font-weight: bold; color: var(--accent); margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
        .menu-category { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .menu-item { padding: 10px 12px; border-radius: 8px; color: var(--text-muted); cursor: pointer; margin-bottom: 5px; text-decoration: none; display: block; border: none; background: none; width: 100%; text-align: left; font-size: 14px; transition: 0.2s; }
        .menu-item:hover, .menu-item.active { background-color: var(--bg-input); color: var(--text-main); }
        .menu-item.active { border-left: 3px solid var(--accent); }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .topbar { height: 70px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; background-color: var(--bg-sidebar); }
        
        .banner-ad-container { background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 10px 30px; text-align: center; }
        .banner-ad-box { background: var(--bg-input); border: 1px dashed var(--border-color); border-radius: 6px; padding: 8px; color: var(--text-muted); font-size: 12px; max-width: 728px; margin: 0 auto; }

        .content-body { padding: 30px; box-sizing: border-box; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; margin-bottom: 30px; }
        
        input, select, textarea { background-color: var(--bg-input) !important; color: var(--text-main) !important; border: 1px solid var(--border-color) !important; border-radius: 8px !important; padding: 12px !important; outline: none !important; width: 100%; box-sizing: border-box; font-family: inherit; margin-bottom: 10px; }
        
        .submit-btn { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); color: #000; font-weight: bold; border: none; border-radius: 8px; padding: 12px 20px; cursor: pointer; width: 100%; }
        
        .script-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 15px; }
        .script-card { background-color: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .script-title { font-weight: bold; color: var(--text-main); font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        .script-desc { font-size: 13px; color: var(--text-muted); flex: 1; }
        
        .status-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        .status-working { background: rgba(0, 236, 100, 0.15); color: #00ec64; border: 1px solid rgba(0, 236, 100, 0.3); }
        .status-patched { background: rgba(255, 77, 77, 0.15); color: #ff4d4d; border: 1px solid rgba(255, 77, 77, 0.3); }

        .card-actions { display: flex; gap: 8px; }
        .copy-btn { flex: 1; background-color: var(--bg-input); color: var(--accent); border: 1px solid var(--accent); padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; }
        .copy-btn:hover { background-color: var(--accent); color: #000; }
        
        .fav-btn { background: none; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .fav-btn.favorited { color: #ff4d4d; border-color: #ff4d4d; background-color: rgba(255, 77, 77, 0.1); }

        /* --- BİREBİR GOOGLE GİRİŞ POPUP EKRANI TASARIMI --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        
        .google-popup-card {
            background-color: #ffffff;
            color: #202124;
            border-radius: 8px;
            width: 450px;
            max-width: 95%;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            text-align: left;
        }

        .google-brand {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .google-brand span:nth-child(1) { color: #4285F4; }
        .google-brand span:nth-child(2) { color: #EA4335; }
        .google-brand span:nth-child(3) { color: #FBBC05; }
        .google-brand span:nth-child(4) { color: #4285F4; }
        .google-brand span:nth-child(5) { color: #34A853; }
        .google-brand span:nth-child(6) { color: #EA4335; }

        .google-popup-card h2 {
            font-size: 24px;
            font-weight: 400;
            margin: 0 0 8px 0;
            color: #202124;
        }

        .google-popup-card p {
            font-size: 14px;
            color: #5f6368;
            margin: 0 0 24px 0;
        }

        .google-input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .google-input-group input {
            background-color: #fff !important;
            color: #202124 !important;
            border: 1px solid #dadce0 !important;
            border-radius: 4px !important;
            padding: 14px !important;
            font-size: 16px !important;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .google-input-group input:focus {
            border-color: #1a73e8 !important;
            border-width: 2px !important;
            padding: 13px !important;
        }

        .google-btn-primary {
            background-color: #1a73e8;
            color: #ffffff;
            font-weight: 500;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            cursor: pointer;
            float: right;
            transition: background-color 0.2s;
        }

        .google-btn-primary:hover {
            background-color: #1557b0;
        }

        .google-btn-text {
            background: none;
            border: none;
            color: #1a73e8;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            padding: 10px 0;
            float: left;
        }

        .google-btn-text:hover {
            background-color: rgba(26,115,232,0.04);
        }

        .user-pill { display: flex; align-items: center; gap: 10px; background: var(--bg-input); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <!-- Sol Menü -->
    <div class="sidebar">
        <div class="logo-area">KLAKZ HUB</div>
        
        <div class="menu-category">Oyun Kategorileri</div>
        <div id="sidebarCategories"></div>

        <div style="margin-top: 20px;" class="menu-category">Özel Alanlar</div>
        <button class="menu-item" onclick="switchCategory('favorites', this)">❤️ Favorilerim (<span id="favCountBadge">0</span>)</button>
        <button class="menu-item" onclick="switchCategory('changelog', this)">🚀 Sürüm Notları</button>
        <button class="menu-item" onclick="switchCategory('ideas', this)">💡 Fikrini Paylaş</button>
        <button class="menu-item" onclick="openAdminPanel()" style="color: var(--accent); font-weight: bold; margin-top: 15px;">⚙️ Yönetim Paneli</button>
    </div>

    <!-- Ana İçerik -->
    <div class="main-content">
        <div class="topbar">
            <input type="text" id="searchInput" placeholder="Script ara..." oninput="filterScripts()" style="width: 250px; margin:0;">
            
            <div id="authArea">
                <button id="authBtn" class="submit-btn" style="width: auto; padding: 8px 16px;" onclick="openLoginModal()">👤 Gmail ile Giriş</button>
            </div>
        </div>

        <div class="banner-ad-container">
            <div class="banner-ad-box">📢 [ Google Adsense / Sponsor Reklam Alanı ]</div>
        </div>

        <div class="content-body">
            <div id="dynamic-content"></div>
        </div>
    </div>

    <!-- Birebir Google Giriş Penceresi Modalı -->
    <div class="modal-overlay" id="loginModal" onclick="handleOverlayClick(event, 'loginModal')">
        <div class="google-popup-card">
            <div class="google-brand">
                <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
            </div>
            <h2>Oturum Açın</h2>
            <p>Klakz Hub'ı kullanmak için Google Hesabınızı kullanın</p>
            
            <div class="google-input-group">
                <input type="text" id="loginName" placeholder="Adınız ve Soyadınız">
            </div>
            
            <div class="google-input-group">
                <input type="email" id="loginGmail" placeholder="E-posta veya telefon (örn: @gmail.com)">
            </div>
            
            <div style="overflow: hidden; margin-top: 10px;">
                <button class="google-btn-text" onclick="closeLoginModal()">İptal</button>
                <button class="google-btn-primary" onclick="handleLogin()">İleri</button>
            </div>
        </div>
    </div>

    <!-- Admin Paneli Modalı -->
    <div class="modal-overlay" id="adminModal" onclick="handleOverlayClick(event, 'adminModal')">
        <div class="card" style="width: 500px; margin: auto; position: relative;">
            <h3 style="margin-top:0;">⚙️ Script Ekleme Paneli</h3>
            <select id="targetGameSelect"></select>
            <input type="text" id="newScriptTitle" placeholder="Script Başlığı">
            <input type="text" id="newScriptDesc" placeholder="Kısa Açıklama">
            <select id="newScriptStatus">
                <option value="working">🟢 Çalışıyor</option>
                <option value="patched">🔴 Patched (Çalışmıyor)</option>
            </select>
            <textarea id="newScriptCode" rows="3" placeholder="loadstring(...)()"></textarea>
            <button class="submit-btn" onclick="adminAddScript()">Scripti Yayınla</button>
            <button style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:10px; cursor:pointer;" onclick="closeAdminPanel()">Kapat</button>
        </div>
    </div>

    <script>
        let authState = JSON.parse(localStorage.getItem('klakz_auth')) || { isLoggedIn: false, name: '', email: '' };
        let favorites = JSON.parse(localStorage.getItem('klakz_favorites')) || [];
        let ideasList = JSON.parse(localStorage.getItem('klakz_ideas')) || [];
        
        let categoryData = JSON.parse(localStorage.getItem('klakz_category_data')) || {
            roblox: {
                title: "🔴 Roblox Scriptleri",
                content: `
                    <div class="script-grid">
                        <div class="script-card" data-title="Blox Fruits Auto Farm" data-status="working">
                            <div class="script-title">Blox Fruits <span class="status-badge status-working">🟢 Çalışıyor</span></div>
                            <div class="script-desc">Otomatik level kasma scripti.</div>
                            <div class="card-actions">
                                <button class="copy-btn" onclick="copyScript(this)" data-code="${encodeURIComponent('loadstring(game:HttpGet("https://raw.githubusercontent.com/ornek/script.lua"))()')}">Kopyala</button>
                                <button class="fav-btn" onclick="toggleFavorite(this, 'Blox Fruits', 'Otomatik level kasma scripti.', 'loadstring(game:HttpGet(\\'https://raw.githubusercontent.com/ornek/script.lua\\'))()')">❤️</button>
                            </div>
                        </div>
                    </div>
                `
            },
            valorant: {
                title: "⚡ Valorant / Diğer",
                content: `<div class="script-grid"></div>`
            }
        };

        let currentKey = 'roblox';

        const specialCategories = {
            favorites: {
                title: "❤️ Favori Scriptlerim",
                content: `<div id="favGrid" class="script-grid"></div>`
            },
            changelog: {
                title: "🚀 Sürüm Notları",
                content: `<div class="card"><h3>v3.1 Güncellemesi</h3><p style="color:var(--text-muted)">• Orijinal Google oturum açma penceresi tasarımı entegre edildi.</p></div>`
            },
            ideas: {
                title: "💡 Fikrini Paylaş",
                content: `
                    <div class="card">
                        <input type="text" id="ideaPlatform" placeholder="Oyun / Platform Adı...">
                        <textarea id="ideaText" rows="3" placeholder="Fikrini yaz..."></textarea>
                        <button class="submit-btn" onclick="submitIdea()">Gönder</button>
                    </div>
                    <div id="publicIdeasList"></div>
                `
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            updateAuthUI();
            renderSidebar();
            switchCategory('roblox');
            updateFavBadge();
        });

        function renderSidebar() {
            let html = '';
            for (let key in categoryData) {
                html += `<button class="menu-item ${(key === currentKey)?'active':''}" onclick="switchCategory('${key}', this)">${categoryData[key].title}</button>`;
            }
            document.getElementById('sidebarCategories').innerHTML = html;
        }

        function switchCategory(key, element) {
            currentKey = key;
            document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
            if(element) element.classList.add('active');

            const data = categoryData[key] || specialCategories[key];
            if(!data) return;

            document.getElementById('dynamic-content').innerHTML = `
                <div style="margin-bottom: 20px;"><h2 style="margin:0;">${data.title}</h2></div>
                ${data.content}
            `;

            if(key === 'favorites') renderFavorites();
            if(key === 'ideas') renderPublicIdeas();
        }

        function handleLogin() {
            const name = document.getElementById('loginName').value.trim();
            const email = document.getElementById('loginGmail').value.trim();
            if(!name || !email.includes('@gmail.com')) {
                alert('Lütfen geçerli bir ad ve @gmail.com adresi girin!');
                return;
            }
            
            authState = { isLoggedIn: true, name, email };
            localStorage.setItem('klakz_auth', JSON.stringify(authState));
            closeLoginModal();
            updateAuthUI();
        }

        function handleLogout() {
            authState = { isLoggedIn: false, name: '', email: '' };
            localStorage.removeItem('klakz_auth');
            updateAuthUI();
        }

        function updateAuthUI() {
            const authArea = document.getElementById('authArea');
            if(authState.isLoggedIn) {
                authArea.innerHTML = `
                    <div class="user-pill">
                        <span style="font-size:13px; font-weight:600;">👤 ${authState.name}</span>
                        <button onclick="handleLogout()" style="background:none; border:none; color:#ff4d4d; cursor:pointer; font-size:11px; padding:0; margin-left:5px;">Çıkış</button>
                    </div>
                `;
            } else {
                authArea.innerHTML = `<button class="submit-btn" style="width: auto; padding: 8px 16px;" onclick="openLoginModal()">👤 Gmail ile Giriş</button>`;
            }
        }

        function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
        
        function openAdminPanel() {
            if(!authState.isLoggedIn) { alert('Yönetim paneline erişmek için önce giriş yapmalısın!'); openLoginModal(); return; }
            document.getElementById('adminModal').style.display = 'flex';
            let h = '';
            for(let k in categoryData) h += `<option value="${k}">${categoryData[k].title}</option>`;
            document.getElementById('targetGameSelect').innerHTML = h;
        }
        function closeAdminPanel() { document.getElementById('adminModal').style.display = 'none'; }
        
        function handleOverlayClick(e, id) { if(e.target.id === id) document.getElementById(id).style.display = 'none'; }

        function copyScript(btn) {
            const rawCode = decodeURIComponent(btn.getAttribute('data-code'));
            navigator.clipboard.writeText(rawCode).then(() => {
                let orig = btn.textContent;
                btn.textContent = "✔️ Kopyalandı";
                setTimeout(() => btn.textContent = orig, 2000);
            });
        }

        function toggleFavorite(btn, title, desc, code) {
            const index = favorites.findIndex(f => f.title === title);
            if (index > -1) {
                favorites.splice(index, 1);
                btn.classList.remove('favorited');
            } else {
                favorites.push({ title, desc, code });
                btn.classList.add('favorited');
            }
            localStorage.setItem('klakz_favorites', JSON.stringify(favorites));
            updateFavBadge();
            if (currentKey === 'favorites') switchCategory('favorites');
        }

        function updateFavBadge() { document.getElementById('favCountBadge').textContent = favorites.length; }

        function renderFavorites() {
            const grid = document.getElementById('favGrid');
            if (!grid) return;
            if (favorites.length === 0) { grid.innerHTML = '<p style="color:var(--text-muted)">Favori script eklenmemiş.</p>'; return; }
            let h = '';
            favorites.forEach(f => {
                h += `
                    <div class="script-card">
                        <div class="script-title">${f.title}</div>
                        <div class="script-desc">${f.desc}</div>
                        <div class="card-actions">
                            <button class="copy-btn" onclick="copyScript(this)" data-code="${encodeURIComponent(f.code)}">Kopyala</button>
                            <button class="fav-btn favorited" onclick="toggleFavorite(this, '${f.title}', '${f.desc}', '${encodeURIComponent(f.code)}')">❤️</button>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = h;
        }

        function adminAddScript() {
            const g = document.getElementById('targetGameSelect').value;
            const t = document.getElementById('newScriptTitle').value;
            const d = document.getElementById('newScriptDesc').value;
            const s = document.getElementById('newScriptStatus').value;
            const c = document.getElementById('newScriptCode').value;
            if(!t || !c) return alert('Başlık ve kod zorunludur!');

            const statusHtml = s === 'working' ? '<span class="status-badge status-working">🟢 Çalışıyor</span>' : '<span class="status-badge status-patched">🔴 Patched</span>';
            const card = `
                <div class="script-card" data-title="${t}" data-status="${s}">
                    <div class="script-title">${t} ${statusHtml}</div>
                    <div class="script-desc">${d}</div>
                    <div class="card-actions">
                        <button class="copy-btn" onclick="copyScript(this)" data-code="${encodeURIComponent(c)}">Kopyala</button>
                        <button class="fav-btn" onclick="toggleFavorite(this, '${t}', '${d}', '${encodeURIComponent(c)}')">❤️</button>
                    </div>
                </div>
            `;
            categoryData[g].content = categoryData[g].content.replace('</div>', card + '</div>');
            localStorage.setItem('klakz_category_data', JSON.stringify(categoryData));
            closeAdminPanel();
            alert('Script başarıyla eklendi!');
            if(currentKey === g) switchCategory(g);
        }

        function submitIdea() {
            const p = document.getElementById('ideaPlatform').value;
            const t = document.getElementById('ideaText').value;
            if(!p || !t) return alert('Tüm alanları doldurun.');
            ideasList.unshift({ platform: p, text: t });
            localStorage.setItem('klakz_ideas', JSON.stringify(ideasList));
            renderPublicIdeas();
            alert('Fikriniz iletildi!');
        }

        function renderPublicIdeas() {
            const c = document.getElementById('publicIdeasList');
            if(!c) return;
            let h = '';
            ideasList.forEach(i => {
                h += `<div class="card" style="margin-top:10px; padding:15px;"><b style="color:var(--accent);">${i.platform}</b>: ${i.text}</div>`;
            });
            c.innerHTML = h;
        }

        function filterScripts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.script-card').forEach(card => {
                const title = card.getAttribute('data-title')?.toLowerCase() || '';
                card.style.display = title.includes(query) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
