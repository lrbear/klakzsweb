<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klakz Hub | Script Center</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #00f2fe;
            margin-bottom: 25px;
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
        }
        .container {
            width: 100%;
            max-width: 650px;
        }
        /* Admin Panel / Form Alanı */
        .admin-card {
            background: #181822;
            border: 1px dashed #00f2fe;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .admin-card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #00f2fe;
        }
        .form-group {
            margin-bottom: 12px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #2a2a3a;
            background: #0f0f13;
            color: #fff;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .btn-add {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-add:hover {
            background: #4facfe;
        }

        /* Script Kartları */
        .script-card {
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #00f2fe;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .script-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .script-desc {
            font-size: 0.9rem;
            color: #a0a0b0;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .btn-copy {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-copy.copied {
            background: #00e676 !important;
        }
    </style>
</head>
<body>

    <h1>Klakz Script Hub</h1>

    <div class="container">
        <!-- Script Ekleme Formu -->
        <div class="admin-card">
            <h2>yeni Script Ekle</h2>
            <div class="form-group">
                <input type="text" id="title" placeholder="Script Başlığı (Örn: Blox Fruits Auto Farm)">
            </div>
            <div class="form-group">
                <input type="text" id="desc" placeholder="Açıklama (Örn: Otomatik level ve item kasma)">
            </div>
            <div class="form-group">
                <textarea id="code" placeholder="Script Kodunu Buraya Yapıştırın (loadstring...)"></textarea>
            </div>
            <button class="btn-add" onclick="addScript()">Veritabanına Gönder</button>
        </div>

        <!-- Script Listesi -->
        <div id="script-list"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDpuJm6D9752OUXZ12L__agm3UmOI1I7Dw",
        authDomain: "klakznew.firebaseapp.com",
        databaseURL: "https://klakznew-default-rtdb.firebaseio.com",
        projectId: "klakznew",
        storageBucket: "klakznew.firebasestorage.app",
        messagingSenderId: "238260974670",
        appId: "1:238260974670:web:2e79129396a2b0967aff1f",
        measurementId: "G-0BSKME20V1"
      };

      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      // Otomatik Script Ekleme İşlevi
      function addScript() {
          const title = document.getElementById("title").value;
          const desc = document.getElementById("desc").value;
          const code = document.getElementById("code").value;

          if (!title || !code) {
              alert("Lütfen başlık ve kod alanlarını doldurun!");
              return;
          }

          database.ref("scripts").push({
              title: title,
              desc: desc,
              code: code
          }).then(() => {
              alert("Script başarıyla eklendi!");
              document.getElementById("title").value = "";
              document.getElementById("desc").value = "";
              document.getElementById("code").value = "";
          }).catch((error) => {
              alert("Hata oluştu: " + error.message);
          });
      }

      // Kopyalama İşlevi
      function copyScript(code, button) {
          navigator.clipboard.writeText(code).then(() => {
              const originalText = button.innerText;
              button.innerText = "Kopyalandı! ✓";
              button.classList.add("copied");
              setTimeout(() => {
                  button.innerText = originalText;
                  button.classList.remove("copied");
              }, 2000);
          });
      }

      // Canlı Veri Dinleme ve Listeleme
      const scriptListDiv = document.getElementById("script-list");
      
      database.ref("scripts").on("value", (snapshot) => {
          scriptListDiv.innerHTML = "";
          const data = snapshot.val();

          if (!data) {
              scriptListDiv.innerHTML = `<div class="script-card"><div class="script-title">Henüz Script Yok</div><div class="script-desc">Yukarıdaki formdan ilk scriptini ekleyebilirsin.</div></div>`;
              return;
          }

          Object.keys(data).forEach(key => {
              const item = data[key];
              const card = document.createElement("div");
              card.className = "script-card";
              card.innerHTML = `
                  <div class="script-title">${item.title}</div>
                  <div class="script-desc">${item.desc || 'Açıklama yok.'}</div>
                  <button class="btn-copy" onclick="copyScript(\`${item.code}\`, this)">Scripti Kopyala</button>
              `;
              scriptListDiv.appendChild(card);
          });
      });
    </script>
</body>
</html>
