<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Klakz Hub v4.2 - Profesyonel Yönetim</title>
    <!-- Gerekli kütüphaneler ve Firebase aynı kalıyor -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs, getCountFromServer } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        
        // ... (Firebase config aynı) ...
        const firebaseConfig = { /* ... */ };
        const app = initializeApp(firebaseConfig);
        window.FB_Db = getFirestore(app);
        window.FB_Auth = getAuth(app);
        window.FB_Provider = new GoogleAuthProvider();
        window.FB_Methods = { signInWithPopup, signOut, onAuthStateChanged, doc, setDoc, getDoc, collection, getDocs, getCountFromServer };
    </script>

    <style>
        /* ... (Önceki stiller aynı, sadece Toast için ekleme yapıldı) ... */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast { background: var(--accent); color: #000; padding: 12px 20px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <!-- ... (Sidebar ve Ana içerik aynı) ... -->

    <!-- Admin Paneli Modalı (İstatistik Eklendi) -->
    <div class="modal-overlay" id="adminModal">
        <div class="card" style="width: 520px; margin: auto;">
            <h3>⚙️ Admin Paneli v4.2</h3>
            
            <div id="adminStats" style="background:var(--bg-input); padding:15px; border-radius:8px; margin-bottom:15px;">
                <p>📊 <b>İstatistikler:</b> <span id="statCount">Yükleniyor...</span></p>
            </div>

            <!-- ... (Diğer admin inputları) ... -->
            <button class="submit-btn" onclick="adminAddScriptWithDiscord()">Scripti Yayınla & Discord'a Gönder</button>
        </div>
    </div>

    <script>
        // 5. Toast Bildirim Fonksiyonu
        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // 2. Discord Webhook Entegrasyonu
        async function sendToDiscord(title, desc) {
            const webhookUrl = "BURAYA_DISCORD_WEBHOOK_URL_YAPISTIR";
            await fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    embeds: [{ title: "🚀 Yeni Hile Yayında!", description: `**${title}**\n${desc}`, color: 0x00ec64 }]
                })
            });
        }

        // 3. Canlı Geri Sayım
        function startPremiumCountdown(expiry) {
            setInterval(() => {
                const now = Date.now();
                const diff = expiry - now;
                if (diff <= 0) return;
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('countdown').innerHTML = `${d}g ${h}s ${m}d ${s}sn`;
            }, 1000);
        }

        // 4. İstatistikleri Çek
        async function updateAdminStats() {
            const users = await window.FB_Methods.getCountFromServer(collection(window.FB_Db, "users"));
            document.getElementById('statCount').innerHTML = `Toplam ${users.data().count} Kayıtlı Üye`;
        }

        // Admin butonu güncellendi
        async function adminAddScriptWithDiscord() {
            const t = document.getElementById('newScriptTitle').value;
            const d = document.getElementById('newScriptDesc').value;
            // ... (Script ekleme mantığı) ...
            await sendToDiscord(t, d);
            showToast("Script başarıyla eklendi ve Discord'a bildirildi!");
        }
    </script>
</body>
</html>
