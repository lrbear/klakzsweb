<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Klakz Hub v4.3 - Full Professional</title>
    <style>
        :root { --bg: #0f0f0f; --card: #1a1a1a; --accent: #00e5ff; }
        body { background: var(--bg); color: white; font-family: sans-serif; }
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .script-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; }
        .admin-panel { background: #252525; padding: 20px; margin: 20px; border-radius: 8px; }
        input, button { padding: 10px; margin: 5px; border-radius: 5px; border: none; }
        button { cursor: pointer; background: var(--accent); color: #000; font-weight: bold; }
    </style>
</head>
<body>

<!-- Admin Paneli (Özellik 3: Düzenleme ve Silme) -->
<div class="admin-panel" id="adminPanel">
    <h2>Admin Paneli</h2>
    <input type="text" id="sName" placeholder="Script Adı">
    <input type="text" id="sPreview" placeholder="Önizleme Video URL">
    <textarea id="sCode" placeholder="Script Kodu"></textarea>
    <button onclick="saveScript()">Script Kaydet/Düzenle</button>
</div>

<!-- Ana Liste -->
<div class="container" id="scriptList"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    // Firebase Başlatma
    const db = getFirestore(initializeApp({ /* Config Bilgilerin */ }));

    // Özellik 3: Script Kaydetme / Düzenleme Fonksiyonu
    window.saveScript = async () => {
        const name = document.getElementById('sName').value;
        const preview = document.getElementById('sPreview').value;
        const code = document.getElementById('sCode').value;
        
        await addDoc(collection(db, "scripts"), { name, preview, code, timestamp: Date.now() });
        alert("Script eklendi!");
        loadScripts();
    };

    // Özellik 3: Silme Fonksiyonu
    window.deleteScript = async (id) => {
        if(confirm("Silmek istediğine emin misin?")) {
            await deleteDoc(doc(db, "scripts", id));
            loadScripts();
        }
    };

    // Özellik 1 & 4: Scriptleri Listeleme ve Render Etme
    async function loadScripts() {
        const snap = await getDocs(collection(db, "scripts"));
        const list = document.getElementById('scriptList');
        list.innerHTML = "";
        
        snap.forEach(doc => {
            const data = doc.data();
            list.innerHTML += `
                <div class="script-card">
                    <h3>${data.name}</h3>
                    ${data.preview ? `<a href="${data.preview}" target="_blank">🎥 Önizleme</a>` : ''}
                    <button onclick="deleteScript('${doc.id}')" style="background:red; color:white;">Sil</button>
                    <button onclick="copyCode('${data.code}')">Kopyala</button>
                </div>
            `;
        });
    }

    window.copyCode = (code) => { navigator.clipboard.writeText(code); alert("Kopyalandı!"); };
    loadScripts();
</script>
</body>
</html>
