<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klakz Hub - Gelişmiş Yönetim & Premium Paneli</title>
    
    <!-- Tarayıcı Sekme Simgesi (Favicon - K Logosu) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'><rect width='100%' height='100%' rx='100' fill='%2312141c'/><path d='M160 120 v260 M200 250 L320 130 M200 250 L320 370' stroke='%2300ec64' stroke-width='45' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">

    <style>
        /* --- TEMA DEĞİŞKENLERİ --- */
        :root {
            --bg-body: #0b0c10;
            --bg-sidebar: #12141c;
            --bg-card: #15171e;
            --bg-input: #1a1c23;
            --border-color: #1f2330;
            --text-main: #ffffff;
            --text-muted: #a0a6b8;
            --accent: #00ec64;
            --accent-hover: #00b34a;
        }

        [data-theme="light"] {
            --bg-body: #f0f2f5;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f8f9fa;
            --border-color: #d1d5db;
            --text-main: #111827;
            --text-muted: #4b5563;
            --accent: #059669;
            --accent-hover: #047857;
        }

        /* --- GENEL STİLLER --- */
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Sol Menü */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            flex-shrink: 0;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .logo-area {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .site-logo-img {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 0 10px rgba(0, 236, 100, 0.4);
        }

        .menu-category {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .menu-item {
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            margin-bottom: 5px;
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-size: 14px;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--bg-input);
            color: var(--text-main);
        }

        .menu-item.active {
            border-left: 3px solid var(--accent);
        }

        /* Sol Menü Reklam Alanı */
        .sidebar-ad {
            margin-top: auto;
            background: var(--bg-input);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Ana İçerik Alanı */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-y: auto;
        }

        /* Üst Bar */
        .topbar {
            height: 70px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            background-color: var(--bg-sidebar);
            transition: background-color 0.3s;
        }

        .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-box input {
            background-color: var(--bg-input) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 20px !important;
            padding: 10px 20px !important;
            color: var(--text-main) !important;
            width: 250px;
            outline: none;
        }

        .filter-select {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 10px 15px;
            outline: none;
            cursor: pointer;
        }

        .topbar-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-toggle-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .theme-toggle-btn:hover { transform: scale(1.05); }

        .admin-btn {
            background-color: var(--bg-input);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
        }
        .admin-btn:hover { background-color: var(--accent); color: #000; }

        .login-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: #000000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Banner & Reklam Alanları */
        .hero-banner {
            width: 100%;
            height: 180px;
            background: linear-gradient(180deg, rgba(11, 12, 16, 0.2) 0%, var(--bg-body) 100%), var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            padding: 25px 30px;
            box-sizing: border-box;
        }

        .hero-title-box { display: flex; align-items: center; gap: 15px; }
        .hero-logo {
            width: 70px; height: 70px; border-radius: 12px;
            border: 2px solid var(--accent); box-shadow: 0 0 20px rgba(0, 236, 100, 0.3);
            object-fit: cover; background-color: var(--bg-sidebar);
        }
        .hero-text h1 { margin: 0; font-size: 28px; color: var(--text-main); }
        .hero-text p { margin: 5px 0 0 0; color: var(--accent); font-size: 14px; font-weight: bold; }

        /* Üst Reklam Alanı (Banner Reklam) */
        .banner-ad-container {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 30px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }
        .banner-ad-box {
            background: var(--bg-input);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 8px;
            max-width: 728px;
            margin: 0 auto;
        }

        /* Gövde */
        .content-body { padding: 30px; box-sizing: border-box; }

        textarea, input[type="text"], input[type="search"], input[type="email"], input[type="password"] {
            background-color: var(--bg-input) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 8px !important;
            padding: 12px !important;
            outline: none !important;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea:focus, input:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 8px rgba(0, 236, 100, 0.25) !important;
        }

        /* Kart Yapısı */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .card h3 { margin-top: 0; color: var(--text-main); display: flex; align-items: center; gap: 8px; }

        .submit-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover)) !important;
            color: #000000 !important; font-weight: bold; border: none; border-radius: 8px;
            padding: 12px 20px; cursor: pointer; transition: opacity 0.2s ease; margin-top: 5px; width: 100%;
        }

        .discord-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            background-color: #5865F2; color: #ffffff !important; font-weight: bold; text-decoration: none;
            padding: 14px 24px; border-radius: 10px; font-size: 16px; transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3); margin-top: 15px;
        }

        .google-login-btn {
            background-color: var(--text-main); color: var(--bg-body); font-weight: 600; border: none;
            border-radius: 8px; padding: 12px 20px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 10px; width: 100%; box-sizing: border-box;
        }

        /* Script Grid */
        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .script-card {
            background-color: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            transition: border-color 0.2s;
        }
        .script-card:hover { border-color: var(--accent); }

        .script-title { font-weight: bold; color: var(--text-main); font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        .script-desc { font-size: 13px; color: var(--text-muted); flex: 1; }

        .status-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: normal; }
        .status-working { background: rgba(0, 236, 100, 0.15); color: #00ec64; border: 1px solid rgba(0, 236, 100, 0.3); }
        .status-patched { background: rgba(255, 77, 77, 0.15); color: #ff4d4d; border: 1px solid rgba(255, 77, 77, 0.3); }

        .card-actions { display: flex; gap: 8px; align-items: center; }
        .copy-btn {
            flex: 1; background-color: var(--bg-input); color: var(--accent); border: 1px solid var(--accent);
            padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; text-align: center;
        }
        .copy-btn:hover { background-color: var(--accent); color: #000; }

        .fav-btn {
            background: none; border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 16px; transition: all 0.2s;
        }
        .fav-btn.favorited { color: #ff4d4d; border-color: #ff4d4d; background-color: rgba(255, 77, 77, 0.1); }

        /* Yorum Alanı */
        .comments-section {
            margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 10px; font-size: 12px;
        }
        .comment-item { color: var(--text-muted); background: var(--bg-input); padding: 4px 8px; border-radius: 4px; margin-top: 4px; }

        /* Modaller */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-box {
            background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
            width: 600px; max-width: 90%; padding: 30px; box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-modal { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }

        .delete-btn {
            background-color: rgba(255, 77, 77, 0.15); color: #ff4d4d; border: 1px solid rgba(255, 77, 77, 0.3);
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .delete-btn:hover { background-color: #ff4d4d; color: #fff; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; }
            .topbar { padding: 0 15px; flex-direction: column; height: auto; gap: 10px; padding: 15px; }
            .search-box input { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Sol Menü -->
    <div class="sidebar">
        <div class="logo-area">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'><rect width='100%' height='100%' rx='100' fill='%2312141c'/><path d='M160 120 v260 M200 250 L320 130 M200 250 L320 370' stroke='%2300ec64' stroke-width='45' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" alt="Klakz Hub Logo" class="site-logo-img">
            KLAKZ HUB
        </div>
        
        <div class="menu-category">Oyun Kategorileri</div>
        <div id="sidebarCategories"></div>

        <div style="margin-top: 20px;" class="menu-category">Özel Alanlar</div>
        <button class="menu-item" onclick="switchCategory('guide', this)">📖 Nasıl Kullanılır?</button>
        <button class="menu-item" onclick="switchCategory('favorites', this)">❤️ Favorilerim (<span id="favCountBadge">0</span>)</button>
        <button class="menu-item" onclick="switchCategory('changelog', this)">🚀 Sürüm Notları</button>
        <button class="menu-item" onclick="switchCategory('ideas', this)">💡 Fikrini Paylaş</button>
        <button class="menu-item" onclick="switchCategory('discord', this)" style="color: #5865F2; font-weight: bold;">💬 Discord</button>
        <button class="menu-item" onclick="switchCategory('premium', this)" style="color: #ffd700; font-weight: bold;">⭐ Premium Hub (VIP)</button>

        <!-- Sol Menü Sponsor/Reklam Alanı -->
        <div class="sidebar-ad">
            <span>Reklam Alanı (Sponsor)</span>
        </div>
    </div>

    <!-- Ana İçerik -->
    <div class="main-content">
        <!-- Üst Bar -->
        <div class="topbar">
            <div class="search-box">
                <input type="search" id="searchInput" placeholder="Script ara..." oninput="filterScripts()">
                <select id="sortSelect" class="filter-select" onchange="filterScripts()">
                    <option value="all">Tümü</option>
                    <option value="working">🟢 Çalışanlar</option>
                    <option value="patched">🔴 Patched</option>
                </select>
            </div>
            <div class="topbar-actions">
                <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Tema Değiştir">☀️</button>
                <button class="admin-btn" id="adminPanelBtn" onclick="openAdminPanel()">⚙️ Yönetim Paneli</button>
                <button class="login-btn" id="authBtn" onclick="openLoginModal()">👤 Giriş Yap</button>
            </div>
        </div>

        <!-- Üst Banner Reklam Alanı -->
        <div class="banner-ad-container">
            <div class="banner-ad-box">
                📢 [ Buraya Google Adsense veya Sponsor Reklam Kodunu Ekleyebilirsin ]
            </div>
        </div>

        <!-- Kapak Banner -->
        <div class="hero-banner">
            <div class="hero-title-box">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'><rect width='100%' height='100%' rx='100' fill='%2312141c'/><path d='M160 120 v260 M200 250 L320 130 M200 250 L320 370' stroke='%2300ec64' stroke-width='45' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" alt="Icon" class="hero-logo">
                <div class="hero-text">
                    <h1>KLAKZ HUB</h1>
                    <p>⚡ Güncel & En Güvenli Script Platformu</p>
                </div>
            </div>
        </div>

        <!-- Gövde -->
        <div class="content-body">
            <div id="dynamic-content"></div>
        </div>
    </div>

    <!-- Giriş Modalı -->
    <div class="modal-overlay" id="loginModal" onclick="handleOverlayClick(event, 'loginModal')">
        <div class="modal-box" style="width: 440px;">
            <div class="modal-header">
                <h3 style="margin:0;">👤 Oturum Aç</h3>
                <button class="close-modal" onclick="closeLoginModal()">&times;</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <input type="text" id="loginUser" placeholder="Kullanıcı Adı (admin)">
                <input type="password" id="loginPass" placeholder="Şifre (admin123)">
                <button class="submit-btn" onclick="handleLogin()">Giriş Yap</button>
            </div>
        </div>
    </div>

    <!-- Admin Paneli Modalı -->
    <div class="modal-overlay" id="adminModal" onclick="handleOverlayClick(event, 'adminModal')">
        <div class="modal-box" style="width: 780px;">
            <div class="modal-header">
                <h3 style="margin:0;">⚙️ Yönetim Paneli</h3>
                <button class="close-modal" onclick="closeAdminPanel()">&times;</button>
            </div>
            <div style="display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; flex-wrap: wrap;">
                <button class="copy-btn" onclick="switchAdminTab('addScriptTab')">➕ Script Ekle</button>
                <button class="copy-btn" onclick="switchAdminTab('gamesTab')">🎮 Oyunlar</button>
                <button class="copy-btn" onclick="switchAdminTab('vipTab')">⭐ VIP Script</button>
                <button class="delete-btn" onclick="handleLogout()">Çıkış Yap</button>
            </div>

            <div id="addScriptTab" class="admin-tab-content">
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <select id="targetGameSelect" class="filter-select" style="width:100%"></select>
                    <input type="text" id="newScriptTitle" placeholder="Script Başlığı">
                    <input type="text" id="newScriptDesc" placeholder="Açıklama">
                    <select id="newScriptStatus" class="filter-select" style="width:100%">
                        <option value="working">🟢 Çalışıyor</option>
                        <option value="patched">🔴 Patched (Çalışmıyor)</option>
                    </select>
                    <textarea id="newScriptCode" rows="3" placeholder="loadstring(...)()"></textarea>
                    <button class="submit-btn" onclick="adminAddScriptToGame()">Script Ekle</button>
                </div>
            </div>

            <div id="gamesTab" class="admin-tab-content" style="display: none;">
                <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                    <input type="text" id="newGameKey" placeholder="Anahtar (örn: valorant)">
                    <input type="text" id="newGameTitle" placeholder="Başlık (örn: ⚡ Valorant)">
                    <button class="submit-btn" style="width: auto; margin:0;" onclick="adminAddGame()">Ekle</button>
                </div>
                <div id="adminGamesContainer"></div>
            </div>

            <div id="vipTab" class="admin-tab-content" style="display: none;">
                <input type="text" id="newVipTitle" placeholder="VIP Script Adı" style="margin-bottom:10px;">
                <input type="text" id="newVipDesc" placeholder="Açıklama" style="margin-bottom:10px;">
                <textarea id="newVipCode" rows="2" placeholder="VIP Kod" style="margin-bottom:10px;"></textarea>
                <button class="submit-btn" onclick="adminAddVipScript()">VIP Ekle</button>
            </div>
        </div>
    </div>

    <script>
        // --- TEMA YÖNETİMİ ---
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('klakz_theme', newTheme);
            document.getElementById('themeToggleBtn').textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('klakz_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggleBtn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
            updateAuthUI();
            renderSidebar();
            const firstKey = Object.keys(categoryData)[0];
            if(firstKey) switchCategory(firstKey);
            updateFavBadge();
        });

        // --- VERİ YAPILARI ---
        let categoryData = JSON.parse(localStorage.getItem('klakz_category_data')) || {
            roblox: {
                title: "🔴 Roblox Scriptleri",
                content: `
                    <div class="script-grid">
                        <div class="script-card" data-title="Blox Fruits Auto Farm" data-status="working">
                            <div class="script-title">
                                Blox Fruits Auto Farm 
                                <span class="status-badge status-working">🟢 Çalışıyor</span>
                            </div>
                            <div class="script-desc">Otomatik level kasma ve meyve toplama scripti.</div>
                            <div class="card-actions">
                                <button class="copy-btn" onclick="copyScript(this)" data-code="${encodeURIComponent('loadstring(game:HttpGet("https://raw.githubusercontent.com/ornek/script/main.lua"))()')}">Kopyala</button>
                                <button class="fav-btn" onclick="toggleFavorite(this, 'Blox Fruits Auto Farm', 'Otomatik level kasma ve meyve toplama scripti.', 'loadstring(game:HttpGet(\\'https://raw.githubusercontent.com/ornek/script/main.lua\\'))()')">❤️</button>
                            </div>
                            <div class="comments-section">
                                <div>💬 Geri Bildirimler:</div>
                                <div class="comment-item">Bende sorunsuz çalıştı! 👍</div>
                            </div>
                        </div>
                    </div>
                `
            }
        };

        let favorites = JSON.parse(localStorage.getItem('klakz_favorites')) || [];
        let vipScripts = JSON.parse(localStorage.getItem('klakz_vip_scripts')) || [];
        let ideasList = JSON.parse(localStorage.getItem('klakz_ideas')) || [];
        let authState = JSON.parse(localStorage.getItem('klakz_auth')) || { isLoggedIn: true, name: 'Admin', email: 'admin', isAdmin: true };
        let currentKey = 'roblox';

        const specialCategories = {
            guide: {
                title: "📖 Script Çalıştırma Kılavuzu (Nasıl Kullanılır?)",
                content: `
                    <div class="card">
                        <h3>🚀 Scriptler Nasıl Çalıştırılır?</h3>
                        <p style="color: var(--text-muted); line-height: 1.6;">
                            1. Oynadığınız oyuna uygun bir <b>Executor (Çalıştırıcı)</b> indirin (Örn: Krnl, Synapse X veya mobil için Arceus X).<br>
                            2. Oyuna giriş yaptıktan sonra Executor programını açın ve oyuna inject (bağlantı) edin.<br>
                            3. Sitemizden beğendiğiniz scriptin yanındaki <b>"Kopyala"</b> butonuna basın.<br>
                            4. Kopyaladığınız kodu Executor penceresine yapıştırın ve <b>Execute</b> tuşuna basarak hileyi aktif edin!
                        </p>
                    </div>
                `
            },
            favorites: {
                title: "❤️ Favori Scriptlerim",
                content: `<div class="card"><h3>❤️ Kaydettiğin Favori Scriptler</h3><div id="favGrid" class="script-grid" style="margin-top:15px;"></div></div>`
            },
            changelog: {
                title: "🚀 Sürüm Notları (Yenilikler)",
                content: `
                    <div class="card">
                        <h3>v2.5 Güncellemesi</h3>
                        <p style="color: var(--text-muted);">• Aydınlık ve Karanlık mod eklendi.<br>• Çalışıyor / Patched rozetleri sisteme dahil edildi.<br>• Favori sistemi ve hızlı kopyalama özellikleri aktifleştirildi.</p>
                    </div>
                `
            },
            ideas: {
                title: "💡 Fikrini Paylaş",
                content: `
                    <div class="card">
                        <h3>💡 Fikrini Paylaş</h3>
                        <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
                            <input type="text" id="ideaPlatform" placeholder="Oyun / Platform Adı...">
                            <textarea id="ideaText" rows="4" placeholder="Fikrini veya isteğini buraya yaz..."></textarea>
                            <button class="submit-btn" onclick="submitIdea()">Öneriyi Gönder</button>
                        </div>
                    </div>
                    <div class="card"><h3>📋 Paylaşılan Fikirler</h3><div id="publicIdeasList"></div></div>
                `
            },
            discord: {
                title: "💬 Discord",
                content: `<div class="card" style="text-align: center; padding: 40px;"><h2 style="color:var(--text-main);">Klakz Hub Discord</h2><a href="https://discord.gg/SUNUCU" target="_blank" class="discord-btn">🚀 Discord'a Katıl</a></div>`
            },
            premium: {
                title: "⭐ Premium Hub (VIP Özel)",
                content: `<div class="card" style="border-color: #ffd700;"><h3>⭐ VIP Özel Scriptler</h3><div id="publicVipGrid" class="script-grid" style="margin-top: 15px;"></div></div>`
            }
        };

        // --- YARDIMCI FONKSİYONLAR ---
        function escapeHtml(text) {
            if (!text) return '';
            return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function copyScript(btn) {
            const rawCode = decodeURIComponent(btn.getAttribute('data-code'));
            navigator.clipboard.writeText(rawCode).then(() => {
                const orig = btn.textContent;
                btn.textContent = "✔️ Kopyalandı";
                setTimeout(() => btn.textContent = orig, 2000);
            });
        }

        // --- FAVORİ SİSTEMİ ---
        function toggleFavorite(btn, title, desc, code) {
            const index = favorites.findIndex(f => f.title === title);
            if (index > -1) {
                favorites.splice(index, 1);
                btn.classList.remove('favorited');
            } else {
                favorites.push({ title, desc, code });
                btn.classList.add('favorited');
            }
            localStorage.setItem('klakz_favorites', JSON.stringify(favorites));
            updateFavBadge();
            if (currentKey === 'favorites') switchCategory('favorites');
        }

        function updateFavBadge() {
            document.getElementById('favCountBadge').textContent = favorites.length;
        }

        function renderFavorites() {
            const grid = document.getElementById('favGrid');
            if (!grid) return;
            if (favorites.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted);">Henüz favoriye script eklemediniz.</p>';
                return;
            }
            let html = '';
            favorites.forEach(f => {
                html += `
                    <div class="script-card">
                        <div class="script-title">${escapeHtml(f.title)}</div>
                        <div class="script-desc">${escapeHtml(f.desc)}</div>
                        <div class="card-actions">
                            <button class="copy-btn" onclick="copyScript(this)" data-code="${encodeURIComponent(f.code)}">Kopyala</button>
                            <button class="fav-btn favorited" onclick="toggleFavorite(this, '${escapeHtml(f.title)}', '${escapeHtml(f.desc)}', '${encodeURIComponent(f.code)}')">❤️</button>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        // --- ARAMA VE FİLTRELEME ---
        function filterScripts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const sortVal = document.getElementById('sortSelect').value;
            const cards = document.querySelectorAll('.script-card');

            cards.forEach(card => {
                const title = card.getAttribute('data-title')?.toLowerCase() || '';
                const status = card.getAttribute('data-status') || '';
                const matchesQuery = title.includes(query);
                const matchesSort = (sortVal === 'all' || status === sortVal);

                if (matchesQuery && matchesSort) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // --- SIDEBAR VE KATEGORİ ---
        function renderSidebar() {
            const container = document.getElementById('sidebarCategories');
            let html = '';
            for (let key in categoryData) {
                const data = categoryData[key];
                html += `<button class="menu-item ${(key === currentKey)?'active':''}" onclick="switchCategory('${key}', this)">${escapeHtml(data.title)}</button>`;
            }
            container.innerHTML = html;
        }

        function switchCategory(key, element) {
            currentKey = key;
            document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
            if(element) element.classList.add('active');

            const data = categoryData[key] || specialCategories[key];
            if(!data) return;

            document.getElementById('dynamic-content').innerHTML = `
                <div style="margin-bottom: 20px;"><h2 style="margin:0;">${escapeHtml(data.title)}</h2></div>
                ${data.content}
            `;

            if(key === 'favorites') renderFavorites();
            if(key === 'ideas') renderPublicIdeas();
            if(key === 'premium') renderPublicVipScripts();
        }

        // --- DİĞER İŞLEVLER ---
        function updateAuthUI() {
            const adminBtn = document.getElementById('adminPanelBtn');
            const authBtn = document.getElementById('authBtn');
            if (authState.isLoggedIn) {
                authBtn.innerHTML = `👤 ${escapeHtml(authState.name)}`;
                adminBtn.style.display = authState.isAdmin ? 'block' : 'none';
            } else {
                adminBtn.style.display = 'none';
                authBtn.innerHTML = '👤 Giriş Yap';
            }
        }

        function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
        function handleOverlayClick(e, id) { if(e.target.id === id) document.getElementById(id).style.display = 'none'; }

        function handleLogin() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            if(u === 'admin' && p === 'admin123') {
                authState = { isLoggedIn: true, name: 'Admin', email: 'admin', isAdmin: true };
                localStorage.setItem('klakz_auth', JSON.stringify(authState));
                closeLoginModal(); updateAuthUI(); openAdminPanel();
            } else alert('Hatalı giriş!');
        }

        function handleLogout() {
            authState = { isLoggedIn: false, name: '', email: '', isAdmin: false };
            localStorage.removeItem('klakz_auth');
            closeAdminPanel(); updateAuthUI();
        }

        function openAdminPanel() { document.getElementById('adminModal').style.display = 'flex'; renderAdminGames(); }
        function closeAdminPanel() { document.getElementById('adminModal').style.display = 'none'; }
        function switchAdminTab(tabId) {
            document.querySelectorAll('.admin-tab-content').forEach(e => e.style.display = 'none');
            document.getElementById(tabId).style.display = 'block';
        }

        function adminAddGame() {
            const k = document.getElementById('newGameKey').value.trim();
            const t = document.getElementById('newGameTitle').value.trim();
            if(!k || !t) return;
            categoryData[k] = { title: t, content: '<div class="script-grid"></div>' };
            localStorage.setItem('klakz_category_data', JSON.stringify(categoryData));
            renderSidebar(); renderAdminGames();
        }

        function renderAdminGames() {
            const sel = document.getElementById('targetGameSelect');
            if(sel) {
                let h = '';
                for(let k in categoryData) h += `<option value="${k}">${categoryData[k].title}</option>`;
                sel.innerHTML = h;
            }
        }

        function adminAddScriptToGame() {
            const g = document.getElementById('targetGameSelect').value;
            const t = document.getElementById('newScriptTitle').value;
            const d = document.getElementById('newScriptDesc').value;
            const s = document.getElementById('newScriptStatus').value;
            const c = document.getElementById('newScriptCode').value;
            if(!g || !t || !c) return;

            const statusHtml = s === 'working' ? '<span class="status-badge status-working">🟢 Çalışıyor</span>' : '<span class="status-badge status-patched">🔴 Patched</span>';

            const card = `
                <div class="script-card" data-title="${escapeHtml(t)}" data-status="${s}">
                    <div class="script-title">${escapeHtml(t)} ${statusHtml}</div>
                    <div class="script-desc">${escapeHtml(d)}</div>
                    <div class="card-actions">
                        <button class="copy-btn" onclick="copyScript(this)" data-code="${encodeURIComponent(c)}">Kopyala</button>
                        <button class="fav-btn" onclick="toggleFavorite(this, '${escapeHtml(t)}', '${escapeHtml(d)}', '${encodeURIComponent(c)}')">❤️</button>
                    </div>
                </div>
            `;
            categoryData[g].content = categoryData[g].content.replace('</div>', card + '</div>');
            localStorage.setItem('klakz_category_data', JSON.stringify(categoryData));
            alert('Script eklendi!');
            if(currentKey === g) switchCategory(g);
        }

        function submitIdea() {
            const p = document.getElementById('ideaPlatform').value;
            const t = document.getElementById('ideaText').value;
            if(!p || !t) return;
            ideasList.unshift({ platform: p, text: t });
            localStorage.setItem('klakz_ideas', JSON.stringify(ideasList));
            renderPublicIdeas();
            alert('Fikir gönderildi!');
        }

        function renderPublicIdeas() {
            const c = document.getElementById('publicIdeasList');
            if(!c) return;
            let h = '';
            ideasList.forEach(i => {
                h += `<div style="background:var(--bg-sidebar); padding:12px; border-radius:8px; margin-top:8px;"><b style="color:var(--accent);">${escapeHtml(i.platform)}</b>: ${escapeHtml(i.text)}</div>`;
            });
            c.innerHTML = h;
        }

        function renderPublicVipScripts() {
            const g = document.getElementById('publicVipGrid');
            if(!g) return;
            if(vipScripts.length === 0) { g.innerHTML = '<p style="color:var(--text-muted);">VIP script yok.</p>'; return; }
            let h = '';
            vipScripts.forEach(v => {
                h += `<div class="script-card"><div class="script-title">${escapeHtml(v.title)}</div><button class="copy-btn" onclick="copyScript(this)" data-code="${encodeURIComponent(v.code)}">Kopyala</button></div>`;
            });
            g.innerHTML = h;
        }

        function adminAddVipScript() {
            const title = document.getElementById('newVipTitle').value;
            const desc = document.getElementById('newVipDesc').value;
            const code = document.getElementById('newVipCode').value;
            if(!title || !code) return;
            vipScripts.push({ title, desc, code });
            localStorage.setItem('klakz_vip_scripts', JSON.stringify(vipScripts));
            alert('VIP eklendi!');
        }
    </script>
</body>
</html>
